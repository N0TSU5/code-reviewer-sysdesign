<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Reviewer Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --stone:#101015; --stone-2:#16161d; --stone-3:#1d1d26;
  --line:#26262f; --line-2:#34343f;
  --ink:#e8e6f0; --ink-2:#a3a0b4; --ink-3:#6b6880;
  --accent:#a78bfa; --accent-2:#7c6cf0; --accent-dim:rgba(167,139,250,.12);
  --amber:#e3a857;
  --wire:#45435a;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px -14px rgba(0,0,0,.9);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1200px 700px at 70% -10%,rgba(64, 22, 88, 0.1),transparent 60%),
  radial-gradient(900px 600px at 0% 110%,rgba(124,108,240,.06),transparent 60%),var(--bg)}

/* solid obsidian panel (class kept as .glass for markup) */
.glass{background:linear-gradient(180deg,var(--stone-2),var(--stone));border:1px solid var(--line);box-shadow:var(--shadow)}

/* header */
header{display:flex;align-items:center;gap:16px;padding:12px 20px 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.brand small{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 span{color:var(--accent)}
.pill{display:flex;align-items:center;gap:10px;padding:5px 7px;border-radius:12px}
.pill button{border:1px solid var(--line);background:var(--stone-3);min-width:32px;height:30px;padding:0 9px;border-radius:8px;cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:border-color .15s,background .15s;font:600 12px var(--mono)}
.pill button:hover{border-color:var(--accent);background:#22202e}
.pill button:disabled{opacity:.3;cursor:default;border-color:var(--line);background:var(--stone-3)}
.dots{display:flex;gap:6px}
.dot{width:8px!important;min-width:0!important;height:8px!important;padding:0!important;border:0!important;border-radius:99px!important;background:var(--line-2)!important;transition:all .3s!important}
.dot.on{width:22px!important;background:var(--accent)!important}
.count{font:600 12px var(--mono);color:var(--ink-2);min-width:42px;text-align:center}

/* stage + camera */
#stage{flex:1;position:relative;min-height:0;margin:0 16px;overflow:hidden;border-radius:16px;touch-action:none;cursor:grab;
  background:#0b0b0f radial-gradient(circle,#1c1c24 1px,transparent 1.2px) 0 0/26px 26px;border:1px solid var(--line)}
#stage.panning{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;width:2320px;height:1320px;transform-origin:0 0}
#canvas.anim{transition:transform .8s cubic-bezier(.22,.8,.2,1)}
#zones,#layer{position:absolute;inset:0}
#zones{z-index:0}
#wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
#layer{z-index:2;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;z-index:5}

.zone{position:absolute;border-radius:26px}
.zone.vpc{border:1.5px dashed #3a3848;background:rgba(16,16,21,.55)}
.zone.pod{border-radius:22px;background:linear-gradient(180deg,#121218,#0e0e13)!important;border-color:#2c2b38!important}
.zone-title{position:absolute;cursor:pointer;pointer-events:auto}
.vpc .zone-title{top:18px;left:0;right:0;text-align:center;font-size:28px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.vpc .zone-title b{font-weight:700}
.pod .zone-title{top:16px;left:26px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.pod .zone-title i{display:block;font:600 13px var(--mono);color:var(--ink-3);font-style:normal;margin-top:3px}
.zone-title:hover{color:var(--accent)}

/* nodes */
.node{position:absolute;border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:5px;pointer-events:auto;
  transition:transform .2s ease,opacity .45s,filter .45s,border-color .2s,box-shadow .2s;overflow:hidden}
.node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}
.node:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 0 1px rgba(167,139,250,.35),0 16px 34px -14px rgba(124,108,240,.45)}
.node .lg{display:flex;align-items:center;gap:6px;font:700 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--accent)}
.node .lg span{font-weight:600;color:var(--ink-2);padding:3px 6px;border-radius:6px;background:var(--stone-3);border:1px solid var(--line);letter-spacing:0}
.node .t{font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.15;color:var(--ink)}
.node .s{font-size:12px;line-height:1.35;color:var(--ink-2)}
.node .row{display:flex;align-items:center;gap:12px}
.node .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--stone-3);border:1px solid var(--line)}
.node .ic svg{width:22px;height:22px}
.node.gate{border-color:#4a3a22;background:linear-gradient(180deg,#1c1710,#14110c)}
.node.gate::before{background:var(--amber)}
.node.gate .lg{color:var(--amber)}
.node.service::before,.node.store::before,.node.ext::before,.node.infra::before{background:var(--ink-3)}
.node.service .lg,.node.store .lg,.node.ext .lg,.node.infra .lg{color:var(--ink-3)}
.node.dim{opacity:.22;filter:grayscale(.6)}
.node.focus{border-color:rgba(167,139,250,.7);box-shadow:0 0 0 1px rgba(167,139,250,.4),0 0 32px -6px rgba(124,108,240,.45)}

/* payload cards */
.card{position:absolute;transform:translate(-50%,-50%);width:204px;border-radius:10px;padding:8px 11px 9px;pointer-events:auto;cursor:pointer;
  background:#0d0d12;border:1px solid var(--line-2);box-shadow:0 10px 24px -12px rgba(0,0,0,.9);
  transition:opacity .45s,border-color .2s,transform .2s}
.card:hover{transform:translate(-50%,-50%) scale(1.04);border-color:var(--accent)}
.card .nm{display:flex;align-items:center;justify-content:space-between;gap:6px;font:700 12px/1.2 var(--mono);margin-bottom:5px}
.card .nm b{color:var(--accent)}
.card .nm i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:600}
.card .sec{font:700 9.5px var(--mono);color:var(--amber);margin:5px 0 2px;letter-spacing:.03em}
.card .r{display:flex;justify-content:space-between;gap:8px;font:500 10.5px/1.55 var(--mono);border-top:1px solid #1b1b23}
.card .r:first-of-type{border-top:0}
.card .r .k{color:var(--ink)}
.card .r .v{color:var(--ink-3);white-space:nowrap}
.card.dim{opacity:.15}
#canvas.far .card .rows{display:none}
#canvas.far .card .nm{font-size:19px;margin:2px 0}
#canvas.far .card .nm i{display:none}
#canvas.far .card{width:auto;padding:10px 16px}

.side-lbl{position:absolute;font-size:15px;font-weight:700;color:var(--ink-2);transform:translateX(-50%);white-space:nowrap;transition:opacity .45s}

/* wires */
.w-halo{fill:none;stroke:#0b0b0f;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .45s}
.w-base{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:opacity .45s}
.w-base.dashed{stroke-dasharray:7 7}
.w-flow{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 19;animation:flow 1.1s linear infinite;transition:opacity .45s;filter:drop-shadow(0 0 3px rgba(167,139,250,.8))}
@keyframes flow{to{stroke-dashoffset:-22}}
.wire.dim .w-base{opacity:.25}
.wire.dim .w-flow{opacity:0}

/* caption */
footer{padding:8px 16px 14px}
.cap{border-radius:14px;padding:14px 20px;display:flex;gap:18px;align-items:center;min-height:92px}
.cap-step{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--mono);color:var(--accent);background:var(--accent-dim);border:1px solid rgba(167,139,250,.35)}
.cap-body{flex:1;min-width:0}
.cap-kicker{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.cap h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:3px 0 3px}
.cap p{font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:960px}
.hint{flex:none;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.hint kbd{font:600 10px var(--mono);padding:2px 6px;border-radius:5px;background:var(--stone-3);border:1px solid var(--line);color:var(--ink-2)}
.cap.swap .cap-body{animation:capIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}}

/* window */
#scrim{position:fixed;inset:0;background:rgba(3,3,6,.7);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#win{position:fixed;z-index:30;width:min(580px,calc(100vw - 32px));max-height:min(78vh,720px);display:none;flex-direction:column;border-radius:14px;overflow:hidden;
  background:var(--stone);border:1px solid var(--line-2);box-shadow:0 40px 90px -20px rgba(0,0,0,.95),0 0 0 1px rgba(167,139,250,.08)}
#win.on{display:flex;animation:winIn .38s cubic-bezier(.18,.9,.25,1.05)}
#win.off{display:flex;animation:winOut .2s ease-in forwards}
@keyframes winIn{from{opacity:0;transform:scale(.25)}}
@keyframes winOut{to{opacity:0;transform:scale(.6)}}
.tb{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:grab;user-select:none;border-bottom:1px solid var(--line);background:var(--stone-2)}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:7px}
.lights span{width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.lights .c{background:#c2566f;cursor:pointer}
.tb-title{font:600 12.5px var(--sans);color:var(--ink-2);flex:1;text-align:center;margin-right:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{padding:20px 22px 22px;overflow:auto}
.wb .kind{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.wb h3{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:4px 0 8px}
.wb .lead{font-size:14px;line-height:1.55;color:var(--ink-2);margin-bottom:6px}
.wb h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.wb ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.wb li{font-size:13.5px;line-height:1.5;padding-left:18px;position:relative;color:var(--ink)}
.wb li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.wb ol{counter-reset:n;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wb ol li{counter-increment:n;padding:7px 9px 7px 34px;border-radius:8px;background:var(--stone-2);border:1px solid var(--line);font-size:12.5px;line-height:1.35}
.wb ol li::before{content:counter(n);background:none;width:auto;height:auto;left:10px;top:7px;font:700 11px var(--mono);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;line-height:1.45}
.kv dt{font:600 12px var(--mono);color:var(--accent)}
.kv dd{color:var(--ink-2)}
pre{font:500 12px/1.6 var(--mono);background:#0a0a0e;border-radius:8px;padding:12px 14px;overflow:auto;border:1px solid var(--line);color:#c9c5dc}
::selection{background:rgba(167,139,250,.35)}

@media (max-width:720px){
  header{padding:10px 12px 6px}
  .brand h1{font-size:15px}
  #stage{margin:0 8px}
  .cap{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px}
  .cap-step{width:38px;height:38px;font-size:14px}
  .hint{display:none}
  .wb ol{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="brand">
    <small>System Design</small>
    <h1>Automated <span>Code Reviewer</span></h1>
  </div>
  <div class="pill glass">
    <button id="prev" aria-label="Previous slide"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Next slide"><svg width="14" height="14" viewBox="0 0 14 14"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<main id="stage">
  <div id="canvas">
    <div id="zones"></div>
    <svg id="wires" viewBox="0 0 2320 1320"></svg>
    <div id="layer"></div>
  </div>
  <div class="zoom pill glass">
    <button id="zOut" aria-label="Zoom out">−</button>
    <button id="zFit" aria-label="Fit slide">Fit</button>
    <button id="zIn" aria-label="Zoom in">+</button>
  </div>
</main>

<footer>
  <div class="cap glass" id="cap">
    <div class="cap-step" id="capStep">01</div>
    <div class="cap-body"><div class="cap-kicker" id="capKicker"></div><h2 id="capTitle"></h2><p id="capText"></p></div>
    <div class="hint"><kbd>←</kbd><kbd>→</kbd> slides · scroll to zoom · drag to pan · click a node or schema</div>
  </div>
</footer>

<div id="scrim"></div>
<div id="win" role="dialog" aria-modal="true">
  <div class="tb" id="tb"><div class="lights"><span class="c" id="winClose" title="Close"></span><span class="m"></span><span class="x"></span></div><div class="tb-title" id="winTitle"></div></div>
  <div class="wb" id="winBody"></div>
</div>

<script>
const CW=2320, CH=1320;

/* ================= ICONS ================= */
const IC = {
  k8s:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.5 20 6.4l2 8.6-5.5 6.9h-9L2 15l2-8.6z" fill="rgba(167,139,250,.12)"/><circle cx="12" cy="12" r="3.2"/><path d="M12 5.5v3.3M12 15.2v3.3M6.2 9.2l3 1.5M14.8 13.3l3 1.5M17.8 9.2l-3 1.5M9.2 13.3l-3 1.5"/></svg>`,
  db:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7"><ellipse cx="12" cy="5.5" rx="7.5" ry="3" fill="rgba(167,139,250,.12)"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>`,
  bucket:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7h18l-1.6 12.2a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8z" fill="rgba(167,139,250,.12)"/><path d="M2.5 4h19v3h-19zM9.5 11.5h5"/></svg>`,
  test:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3" fill="rgba(167,139,250,.12)"/><path d="M7.5 15h9"/></svg>`,
  pulse:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3.5" fill="rgba(167,139,250,.12)"/><path d="M5.5 12h3l2-4 3 8 2-4h3"/></svg>`,
  brain:`<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4" fill="rgba(167,139,250,.12)"/><path d="M9 9h6v6H9zM9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>`
};

/* ================= NODES ================= */
const N = {
  controller:{x:280,y:550,w:180,h:100,kind:'infra',icon:'k8s',lg:'Infrastructure',t:'VPC Endpoint',s:'& K8s Controller'},
  verify:{x:760,y:170,w:200,h:100,kind:'step',lg:'LangGraph Node 1',p:'Conditional Edge',t:'Verify & Dedup',s:'Check SHA-256 & metadata, skip if already handled'},
  static:{x:1200,y:170,w:200,h:100,kind:'step',lg:'LangGraph Node 2',p:'Node',t:'Static Analysis',s:'NASA, robot safety, docstring & lint checks'},
  filter:{x:1640,y:170,w:200,h:100,kind:'step',lg:'LangGraph Node 3',p:'Node',t:'Filter Dupes',s:'Diff against parent hash, keep new defects'},
  llm:{x:1200,y:490,w:200,h:100,kind:'step',lg:'LangGraph Node 4',p:'Send() Fan-Out',t:'LLM Enrichment',s:'Explain each new defect & suggest a fix'},
  gateway:{x:1640,y:490,w:200,h:100,kind:'step service',icon:'brain',lg:'External Service',t:'Private LLM Gateway',s:'Constrained detokenizer'},
  generate:{x:760,y:810,w:200,h:100,kind:'step',lg:'LangGraph Node 5',p:'Node',t:'Generate Handoff Specs',s:'Test specs + runtime monitoring hooks'},
  gate:{x:1200,y:810,w:200,h:100,kind:'step gate',lg:'LangGraph Node 6',p:'interrupt()',t:'Human Approval Gate',s:'State persisted, pod despawns & waits'},
  emit:{x:1640,y:810,w:200,h:100,kind:'step',lg:'LangGraph Node 7',p:'Node → End',t:'Emit Handoff',s:'Atomic outbox publisher'},
  archive:{x:760,y:1120,w:240,h:100,kind:'store',icon:'bucket',lg:'Storage',t:'Partner Object Storage',s:'Code archive · packages & artifacts'},
  postgres:{x:1300,y:1120,w:280,h:100,kind:'store',icon:'db',lg:'Storage',t:'Persistent Postgres DB',s:'Checkpointer · findings ledger · transaction log'},
  testing:{x:2080,y:520,w:200,h:100,kind:'ext',icon:'test',lg:'Downstream',t:'Testing Phase',s:'Generates targeted test suites'},
  monitoring:{x:2080,y:1080,w:200,h:100,kind:'ext',icon:'pulse',lg:'Downstream',t:'Monitoring Phase',s:'Runtime watchdog & telemetry'}
};

/* ================= EDGES + PAYLOAD SCHEMAS ================= */
const E = [
  {from:'client',to:'controller',d:'M0,600 H278',c:[125,600],name:'ReviewRequest',
    sch:[{r:[['uri','string'],['packageSha256','hex'],['parentSha256','hex'],['metadata','object']]}]},
  {from:'controller',to:'pod',d:'M460,600 H718',c:[590,600],name:'JobSpec',
    sch:[{r:[['threadId','packageSha256'],['uri','string'],['parentSha256','hex'],['metadata','object'],['restartPolicy','OnFailure']]}]},
  {from:'archive',to:'verify',d:'M760,1170 H740 V220 H758',c:[740,400],name:'CodePackage',
    sch:[{r:[['uri','string'],['archive','tar.gz bytes'],['contentLength','int'],['storageEtag','string']]}]},
  {from:'verify',to:'static',d:'M960,220 H1198',c:[1080,220],name:'VerifiedPackage',
    sch:[{r:[['packageSha256','hex'],['parentSha256','hex'],['workspacePath','string'],['metadata','object']]}]},
  {from:'static',to:'filter',d:'M1400,220 H1638',c:[1520,220],name:'RawFinding[]',
    sch:[{r:[['ruleId','string'],['category','nasa|safety|doc|lint'],['file','string'],['line','int'],['symbol','string'],['fingerprint','hex']]}]},
  {from:'filter',to:'llm',d:'M1740,270 V380 H1300 V488',c:[1520,380],name:'NewFinding[]',
    sch:[{r:[['findingId','uuid'],['ruleId','string'],['symbol','string'],['snippet','string'],['context','string']]}]},
  {from:'llm',to:'gateway',d:'M1400,540 H1638',c:[1530,540],bi:true,name:'EnrichCall',tag:'⇄',
    sch:[{h:'→ REQUEST',r:[['findingId','uuid'],['ruleId','string'],['snippet','string']]},
         {h:'← RESPONSE',r:[['explanation','string'],['severity','low|med|high'],['suggestedFix','{diff, rationale}']]}]},
  {from:'llm',to:'generate',d:'M1300,590 V700 H860 V808',c:[1080,700],name:'EnrichedFinding[]',
    sch:[{r:[['findingId','uuid'],['explanation','string'],['severity','enum'],['suggestedFix','object'],['publicMethods','Method[]']]}]},
  {from:'generate',to:'gate',d:'M960,860 H1198',c:[1080,860],name:'HandoffSpecs',
    sch:[{r:[['testSpecs','TestSpec[]'],['stressTests','StressTest[]'],['monitorHooks','Hook[]'],['defectWatches','Watch[]']]}]},
  {from:'gate',to:'emit',d:'M1400,860 H1638',c:[1530,860],name:'ApprovalDecision',
    sch:[{r:[['decision','approve|edit|reject'],['reviewer','string'],['edits','Patch[]'],['decidedAt','timestamp']]}]},
  {from:'emit',to:'testing',d:'M1840,845 H2180 V622',c:[2180,735],name:'TestHandoff',

/* ================= NODE DETAILS ================= */
const D = {
  vpc:{kind:'Boundary',t:'Partner VPC (Isolated Environment)',lead:'Everything in the review pipeline runs inside the client\'s own VPC. Source code, the language model, the object store and the Postgres state store never leave the partner\'s network.',
    sec:[{h:'Guarantees',ul:['No public ingress: requests arrive through a private VPC endpoint.','The LLM is self-hosted behind a private gateway, so no code is sent to a third-party API.','Persistent state (the Postgres ledger and checkpoints) lives in the client\'s storage.']}]},
  pod:{kind:'Runtime',t:'Ephemeral LangGraph K8s Pod',lead:'A short-lived Kubernetes pod that runs one LangGraph StateGraph per review. The pod holds no state of its own. Every node commits its state to Postgres, so the pod can be killed and replaced at any point.',
    sec:[{h:'Graph Order',pre:'1  Verify & Dedup        ── already handled? → End\n2  Static Analysis\n3  Filter Dupes\n4  LLM Enrichment        ⇄ Private LLM Gateway\n5  Generate Handoff Specs\n6  Human Approval Gate   (interrupt)\n7  Emit Handoff          → End'},
         {h:'Lifecycle',ul:['Spawned by the K8s controller for each request.','Checkpointed after every node and substep.','Exits while it waits for human approval and is re-spawned to resume.']}]},
  controller:{kind:'Infrastructure',t:'VPC Endpoint & K8s Controller',lead:'The entry point inside the partner VPC. It receives a review request and turns it into an ephemeral Kubernetes Job/Pod that runs the reviewer.',
    sec:[{h:'Responsibilities',ul:['Accept the ReviewRequest on the private VPC endpoint.','Spawn an ephemeral K8s Job/Pod with the package hash as its thread id.','Recovery: if the pod crashes (OOMKilled, node reboot), Kubernetes restarts it, and the new pod reconnects to Postgres and resumes from the last committed checkpoint.']}]},
  verify:{kind:'LangGraph Node 1 · Conditional Edge',t:'Verify & Dedup',lead:'Pulls the code package from object storage and checks that it is exactly the code the client asked to have reviewed. The verified package is then handed to Static Analysis.',
    sec:[{h:'Steps',ul:['Fetch the CodePackage from Partner Object Storage at the given URI.','Recompute its SHA-256 and compare it to packageSha256. A mismatch aborts the run.','Validate the metadata: required fields, parent hash format and policy version.','Look up the hash in the findings ledger. If this package was already reviewed, a conditional edge routes straight to End.']}]},
  static:{kind:'LangGraph Node 2',t:'Static Analysis',lead:'Deterministic checks with no model involved. It runs over the verified package and writes raw findings to the Postgres ledger.',
    sec:[{h:'NASA / JPL Power of 10',ol:['Simple control flow: no goto or recursion','Every loop has a fixed upper bound','No dynamic allocation after init','Functions fit on one page (~60 lines)','At least 2 assertions per function','Data declared at the smallest scope','Check return values and validate parameters','Limited preprocessor use','Restricted pointer use','All warnings enabled, zero warnings']},
         {h:'Robot Safety Checks',ol:['Motion commands clamped to velocity, acceleration, joint and workspace limits before publishing','Every actuator path handles the emergency stop','Command watchdog: actuators stop when commands go stale (deadman timeout)','No blocking calls or unbounded waits inside control loops','Sensor inputs checked for NaN/Inf, range and stale timestamps before use','Error and exception paths drive to a safe state, never hold the last command','Consistent units and coordinate frames (rad vs deg, frame IDs on transforms)','State shared between control threads is protected from data races']},
         {h:'Also Checked',ul:['Comment checker: every public method has a docstring.','Lint bugs from the standard linter rule set.']}]},
  filter:{kind:'LangGraph Node 3',t:'Filter Dupes',lead:'Diffs the findings against the parent codebase\'s review so the same defect is never reported twice.',
    sec:[{h:'How It Works',ul:['Load the parent\'s findings from the ledger using parentSha256.','Fingerprint each finding (rule + symbol + normalised snippet), so a defect that only moved lines is not counted as new.','Only new defects go on to LLM Enrichment. Carried-over defects are linked to the earlier report, not reported again.','If no parent review exists, every finding counts as new.']}]},
  llm:{kind:'LangGraph Node 4 · Send() Fan-Out',t:'LLM Enrichment',lead:'Fans out one task per new violation. Each task sends its snippet to the private LLM gateway and gets back a plain-language explanation and a suggested fix.',
    sec:[{h:'Per Defect',ul:['Only the offending snippet and minimal surrounding context are sent.','The structured response is validated, then written to the ledger.','Each finding is committed as soon as it finishes, so after a crash only the unfinished defects are re-sent.']}]},
  gateway:{kind:'External Service · Not A Graph Node',t:'Private LLM Gateway',lead:'A self-hosted model inside the VPC. A constrained detokenizer restricts decoding to a fixed output schema, so every response is valid and parseable.',
    sec:[{h:'Notes',ul:['No free-form text reaches the pipeline.','All requests are monitored for rate limiting, latency and throughput.']}]},
  generate:{kind:'LangGraph Node 5',t:'Generate Handoff Specs',lead:'Turns the findings into work for the downstream testing and monitoring phases.',
    sec:[{h:'Test Case Specs',ul:['For each public method, analyse the docstring and list the cases that need to be covered.','For methods with NASA violations, add stress tests for time and memory.']},
         {h:'Runtime Monitoring Hooks',ul:['Instrument all database, network and LLM API requests.','Watch security, rate limiting, memory usage, throughput and latency of those components.','For each defect found, monitor the performance of that function.']}]},
  gate:{kind:'LangGraph Node 6 · interrupt()',t:'Human Approval Gate',lead:'The pipeline pauses here until a human reviewer approves. No compute is held while it waits.',
    sec:[{h:'Mechanics',ul:['LangGraph interrupt() writes the full graph state to the Postgres checkpointer.','The pod despawns; the run waits in Postgres, not in memory.','The reviewer approves, edits or rejects the findings and specs.','On a decision, a new pod is spawned with the same thread id and resumes from this node.']}]},
  emit:{kind:'LangGraph Node 7 · Node → End',t:'Emit Handoff',lead:'Publishes the approved handoff to the testing and monitoring phases using the transactional outbox pattern.',
    sec:[{h:'Atomic Outbox',ul:['The handoff payload and an outbox row are written in a single Postgres transaction.','A publisher relays outbox rows downstream with at-least-once delivery.','The package hash serves as the idempotency key, so a retry never double-publishes.']}]},
  testing:{kind:'Downstream',t:'Testing Phase',lead:'Consumes the test case specs and generates targeted test suites.',
    sec:[{h:'Inputs',ul:['Coverage cases for each public method, derived from its docstring.','Time and memory stress tests for methods with NASA violations.']}]},
  monitoring:{kind:'Downstream',t:'Monitoring Phase',lead:'A runtime watchdog plus telemetry, configured from the monitoring hooks.',
    sec:[{h:'Watches',ul:['Database, network and LLM API requests.','Security, rate limiting, memory usage, throughput and latency.','Performance of every function that had a defect.']}]},
  archive:{kind:'Storage',t:'Partner Object Storage',lead:'A partner-owned bucket that holds the secured code packages and generated artifacts.',
    sec:[{h:'Flow',ul:['The code package goes to Verify & Dedup first, to be hashed and validated.','Verify & Dedup passes the verified package on to Static Analysis.','Generated artifacts (reports, specs) are stored next to the source package.']}]},
  postgres:{kind:'Storage',t:'Persistent Postgres DB',lead:'Lives in the client\'s storage and persists across runs. It is the single source of truth for both pipeline state and findings.',
    sec:[{h:'Contents',kv:[['Checkpointer','LangGraph PostgresCheckpointer; the graph node is updated at every substep'],['Findings Ledger','Raw and enriched findings keyed by package hash, used for dedup and the parent diff'],['Transaction Log','Audit trail plus the outbox table for Emit Handoff']]},
         {h:'Recovery',ul:['When a pod fails, Kubernetes spawns a new one that fetches the nearest checkpoint from the table and continues from there.']}]}
};

  {k:'Overview',t:'The Full System',p:'A review request enters the partner VPC. An ephemeral LangGraph pod verifies, analyses, de-duplicates and enriches the findings, waits for human approval, then hands off to the testing and monitoring phases. Every connection carries a typed payload.',f:null},
  {k:'Ingress',t:'Trigger & Spawn',p:'The client sends a ReviewRequest to the VPC endpoint. The K8s controller turns it into a JobSpec and spawns an ephemeral pod to run the reviewer.',f:['client','controller','pod']},
  {k:'LangGraph Node 1',t:'Verify & Dedup',p:'The code package comes from object storage. Its SHA-256 is recomputed, the metadata is validated and the ledger is checked; a package that was already reviewed exits early through a conditional edge.',f:['verify','archive','static']},
  {k:'LangGraph Node 2',t:'Static Analysis',p:'The verified package is checked against the NASA Power of 10 rules, robot safety checks (motion limits, e-stop, watchdogs, sensor validation, fail-safe paths), the docstring checker for public methods and lint. Raw findings are written to the Postgres ledger.',f:['static','verify','postgres','filter']},

  {k:'LangGraph Node 5',t:'Generate Handoff Specs',p:'Docstrings become coverage specs, NASA violations get time and memory stress tests, and monitoring hooks are defined for the DB, network, LLM API and each defective function.',f:['generate','llm','gate']},
  {k:'LangGraph Node 6',t:'Human Approval Gate',p:'interrupt() checkpoints the state and the pod despawns. Nothing runs while the human reviewer decides; the decision re-spawns the pod, which resumes from this node.',f:['gate','generate','emit','postgres','pod']},
  {k:'LangGraph Node 7',t:'Emit Handoff',p:'Approved specs are published through a transactional outbox: a TestHandoff to the testing phase and a MonitorHandoff to the monitoring phase.',f:['emit','gate','testing','monitoring']},
  {k:'Resilience',t:'Persistence & Recovery',p:'Postgres lives in the client\'s storage and records state at every substep. If a pod dies, Kubernetes spawns a new one that resumes from the nearest checkpoint.',f:['postgres','pod','static','llm']}
];

/* ================= BUILD ================= */
const zones=document.getElementById('zones'), layer=document.getElementById('layer'), svg=document.getElementById('wires');
const nodeEls={}, wires=[];
function zone(cls,x,y,w,h,html,id){
  const z=document.createElement('div');z.className='zone '+cls;
  Object.assign(z.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  z.innerHTML=`<div class="zone-title" data-id="${id}">${html}</div>`;
  zones.appendChild(z);
}
zone('vpc',250,20,1670,1260,'<b>Partner VPC (Isolated Environment)</b>','vpc');
zone('pod glass',720,90,1160,890,'Ephemeral LangGraph K8s Pod<i>LangGraph StateGraph Execution</i>','pod');

const clientLbl=document.createElement('div');clientLbl.className='side-lbl';clientLbl.textContent='Client Request';
clientLbl.style.left='125px';clientLbl.style.top='522px';layer.appendChild(clientLbl);

const NS='http://www.w3.org/2000/svg';
svg.innerHTML=`<defs>
<linearGradient id="flowGrad" x1="0" y1="0" x2="${CW}" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#9b7dff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5z" fill="#5d5a78"/></marker>
</defs>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
E.forEach((e,i)=>{
  const g=document.createElementNS(NS,'g');g.setAttribute('class','wire');
  const mk=(cls)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',e.d);p.setAttribute('class',cls);g.appendChild(p);return p;};
  mk('w-halo');
  const b=mk('w-base'+(e.dashed?' dashed':''));b.setAttribute('marker-end','url(#ah)');if(e.bi)b.setAttribute('marker-start','url(#ah)');
  mk('w-flow');
  svg.appendChild(g);
  const c=document.createElement('div');c.className='card';c.dataset.edge=i;
  c.style.left=e.c[0]+'px';c.style.top=e.c[1]+'px';
  c.innerHTML=`<div class="nm"><b>${esc(e.name)}</b><i>${esc(e.tag||'')}</i></div><div class="rows">`+
    e.sch.map(s=>(s.h?`<div class="sec">${s.h}</div>`:'')+s.r.map(([k,v])=>`<div class="r"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('')).join('')+'</div>';
  layer.appendChild(c);
  wires.push({e,g,card:c});
});

Object.entries(N).forEach(([id,n])=>{
  const el=document.createElement('div');el.className='node glass '+n.kind;el.dataset.id=id;
  Object.assign(el.style,{left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px'});
  const lg=`<div class="lg">${n.lg}${n.p?`<span>${esc(n.p)}</span>`:''}</div>`;
  const txt=`${lg}<div class="t">${n.t}</div><div class="s">${n.s}</div>`;
  el.innerHTML=n.icon?`<div class="row"><div class="ic">${IC[n.icon]}</div><div style="display:flex;flex-direction:column;gap:4px">${txt}</div></div>`:txt;
  el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',n.t);
  layer.appendChild(el);nodeEls[id]=el;
});

/* ================= CAMERA ================= */
const stage=document.getElementById('stage'), canvas=document.getElementById('canvas');
let cam={s:1,x:0,y:0};
function apply(anim){
  canvas.classList.toggle('anim',!!anim);
  canvas.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  canvas.classList.toggle('far',cam.s<0.62);
}
function boxFor(sl){
  if(!sl.f)return {x:0,y:10,w:CW,h:CH-10};
  const f=new Set(sl.f);let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  const add=(x,y,w,h)=>{x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x+w);y2=Math.max(y2,y+h);};
  sl.f.forEach(id=>{const n=N[id];if(n)add(n.x,n.y,n.w,n.h);});
  wires.forEach(({e,card})=>{if(f.has(e.from)&&f.has(e.to)){const w=Math.max(card.offsetWidth,204),h=Math.max(card.offsetHeight,120);add(e.c[0]-w/2,e.c[1]-h/2,w,h);}});
  if(f.has('client'))add(10,500,230,40);
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function fitSlide(anim){
  const b=boxFor(S[cur]),W=stage.clientWidth,H=stage.clientHeight,p=S[cur].f?50:16;
  const s=Math.min((W-2*p)/b.w,(H-2*p)/b.h,1.3);
  cam={s,x:(W-b.w*s)/2-b.x*s,y:(H-b.h*s)/2-b.y*s};apply(anim);
}
function zoomAt(k,mx,my,anim){
  const s=Math.min(2.5,Math.max(.25,cam.s*k));
  cam.x=mx-(mx-cam.x)*(s/cam.s);cam.y=my-(my-cam.y)*(s/cam.s);cam.s=s;apply(anim);
}
stage.addEventListener('wheel',e=>{
  e.preventDefault();const r=stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top,false);
},{passive:false});
let pan=null,moved=false;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom'))return;
  pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};moved=false;
});
addEventListener('pointermove',e=>{
  if(!pan)return;const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(!moved&&Math.hypot(dx,dy)<5)return;
  moved=true;stage.classList.add('panning');cam.x=pan.cx+dx;cam.y=pan.cy+dy;apply(false);
});
addEventListener('pointerup',()=>{pan=null;stage.classList.remove('panning');});
const center=()=>[stage.clientWidth/2,stage.clientHeight/2];
document.getElementById('zIn').onclick=()=>zoomAt(1.3,...center(),true);
document.getElementById('zOut').onclick=()=>zoomAt(1/1.3,...center(),true);
document.getElementById('zFit').onclick=()=>fitSlide(true);
new ResizeObserver(()=>fitSlide(false)).observe(stage);

/* ================= SLIDES ================= */
let cur=0;
const dots=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Slide '+(i+1));d.onclick=()=>go(i);dots.appendChild(d);});
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  const sl=S[cur], f=sl.f?new Set(sl.f):null;
  Object.entries(nodeEls).forEach(([id,el])=>{
    el.classList.toggle('dim',!!f&&!f.has(id));
    el.classList.toggle('focus',!!f&&f.has(id));
  });
  wires.forEach(({e,g,card})=>{const off=!!f&&!(f.has(e.from)&&f.has(e.to));g.classList.toggle('dim',off);card.classList.toggle('dim',off);});
  clientLbl.style.opacity=(!f||f.has('client'))?1:.25;
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  document.getElementById('count').textContent=`${cur+1}/${S.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===S.length-1;
  const cap=document.getElementById('cap');cap.classList.remove('swap');void cap.offsetWidth;cap.classList.add('swap');
  document.getElementById('capStep').textContent=String(cur+1).padStart(2,'0');
  document.getElementById('capKicker').textContent=sl.k;
  document.getElementById('capTitle').textContent=sl.t;
  document.getElementById('capText').textContent=sl.p;
  fitSlide(true);
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);

/* ================= WINDOW ================= */
const win=document.getElementById('win'), scrim=document.getElementById('scrim'), body=document.getElementById('winBody');
function renderNode(id){
  const d=D[id];let h=`<div class="kind">${d.kind}</div><h3>${d.t}</h3><p class="lead">${d.lead}</p>`;
  d.sec.forEach(s=>{
    h+=`<h4>${s.h}</h4>`;
    if(s.ul)h+='<ul>'+s.ul.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
    if(s.ol)h+='<ol>'+s.ol.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>';
    if(s.kv)h+='<dl class="kv">'+s.kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')+'</dl>';
    if(s.pre)h+=`<pre>${esc(s.pre)}</pre>`;
  });
  body.innerHTML=h;document.getElementById('winTitle').textContent=d.t;
}
function renderEdge(i){
  const e=E[i];
  const json=e.sch.map(s=>(s.h?`// ${s.h.replace(/[→←] /,'')}\n`:'')+'{\n'+s.r.map(([k,v])=>`  "${k}": ${v}`).join(',\n')+'\n}').join('\n\n');
  body.innerHTML=`<div class="kind">Payload Schema</div><h3>${esc(e.name)}</h3><p class="lead">${NAME[e.from]} ${e.bi?'⇄':'→'} ${NAME[e.to]}</p><h4>Shape</h4><pre>${esc(json)}</pre>`;
  document.getElementById('winTitle').textContent=e.name;
}
function openWin(render,srcEl){
  render();body.scrollTop=0;
  win.classList.remove('off','on');win.style.display='flex';
  const ww=win.offsetWidth,wh=win.offsetHeight,L=(innerWidth-ww)/2,T=Math.max(16,(innerHeight-wh)/2);
  win.style.left=L+'px';win.style.top=T+'px';
  const r=srcEl.getBoundingClientRect();win.style.transformOrigin=`${r.left+r.width/2-L}px ${r.top+r.height/2-T}px`;
  void win.offsetWidth;win.classList.add('on');scrim.classList.add('on');
}
function closeWin(){
  if(!win.classList.contains('on'))return;
  win.classList.remove('on');win.classList.add('off');scrim.classList.remove('on');
  setTimeout(()=>{if(win.classList.contains('off')){win.classList.remove('off');win.style.display='none';}},220);
}
canvas.addEventListener('click',ev=>{
  if(moved)return;
  const n=ev.target.closest('.node, .zone-title');
  if(n)return openWin(()=>renderNode(n.dataset.id),n);
  const c=ev.target.closest('.card');
  if(c)openWin(()=>renderEdge(+c.dataset.edge),c);
});
layer.addEventListener('keydown',ev=>{const id=ev.target.dataset&&ev.target.dataset.id;if((ev.key==='Enter'||ev.key===' ')&&id){ev.preventDefault();openWin(()=>renderNode(id),ev.target);}});
scrim.onclick=closeWin;document.getElementById('winClose').onclick=closeWin;
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')return closeWin();
  if(win.classList.contains('on'))return;
  if(ev.key==='ArrowRight'||ev.key==='PageDown')go(cur+1);
  if(ev.key==='ArrowLeft'||ev.key==='PageUp')go(cur-1);
  if(ev.key==='Home')go(0);if(ev.key==='End')go(S.length-1);
  if(ev.key==='+'||ev.key==='=')zoomAt(1.3,...center(),true);
  if(ev.key==='-')zoomAt(1/1.3,...center(),true);
  if(ev.key==='0')fitSlide(true);
});
(()=>{const tb=document.getElementById('tb');let sx,sy,ox,oy,drag=false;
  tb.addEventListener('pointerdown',e=>{if(e.target.closest('.lights'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;tb.setPointerCapture(e.pointerId);});
  tb.addEventListener('pointermove',e=>{if(!drag)return;
    win.style.left=Math.min(innerWidth-80,Math.max(-win.offsetWidth+80,ox+e.clientX-sx))+'px';
    win.style.top=Math.min(innerHeight-50,Math.max(0,oy+e.clientY-sy))+'px';});
  tb.addEventListener('pointerup',()=>drag=false);
})();

go(0);
</script>
